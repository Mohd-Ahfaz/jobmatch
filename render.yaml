services:
  - type: web
    name: jobmatch
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn jobmatch.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "jobmatch.onrender.com"
      - key: DATABASE_URL
        value: "YOUR_AIVEN_MYSQL_URL_HERE"
      - key: GEMINI_API_KEY
        value: ""
      - key: ADZUNA_APP_ID
        value: ""
      - key: ADZUNA_APP_KEY
        value: ""
      - key: PYTHON_VERSION
        value: "3.11.0"
